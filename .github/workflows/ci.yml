name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: goonj
          POSTGRES_PASSWORD: goonj
          POSTGRES_DB: goonj
        ports:
          - 15433:5432
        options: >-
          --health-cmd "pg_isready -U goonj"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: apps/api/go.sum
      - name: Vet
        working-directory: apps/api
        run: go vet ./...
      - name: Test (unit + store-layer integration)
        working-directory: apps/api
        env:
          GOONJ_TEST_DATABASE: postgres://goonj:goonj@localhost:15433/goonj?sslmode=disable
          MIGRATIONS_DIR: apps/api/migrations
        run: |
          go run ./cmd/seed # applies migrations + seed data (idempotent)
          go test ./...
      - name: Build
        working-directory: apps/api
        run: go build ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun --filter '*' typecheck
      - name: Build web
        run: bun --filter web build

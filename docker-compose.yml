name: goonj

services:
  postgres:
    image: pgvector/pgvector:pg16  # postgres 16 + pgvector (Phase 5 semantic search)
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-goonj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goonj}
      POSTGRES_DB: ${POSTGRES_DB:-goonj}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goonj -d goonj"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  livekit:
    image: livekit/livekit-server:latest
    ports:
      - "${LIVEKIT_HOST_PORT:-7880}:7880"
    volumes:
      - ./apps/api/infra/livekit.yaml:/etc/livekit.yaml:ro
    command:
      ["--config", "/etc/livekit.yaml"]
    # Recording (Phase 3) needs the room-composite egress; --dev mode is
    # replaced with an explicit config that uses the devkey/devsecret pair
    # from .env.example. Production runs livekit with TLS + TURN.

  # Room-composite egress: renders the room (audio-only) and uploads the MP3
  # recording to floci when a session ends. Needs redis to receive jobs from
  # the livekit server and storage creds to write recordings.
  # Shares livekit's network namespace so Chrome's template page can open an
  # insecure ws://localhost:7880 signal (https pages block other ws:// hosts).
  livekit-egress:
    image: livekit/egress:latest
    network_mode: "service:livekit"
    environment:
      EGRESS_CONFIG_FILE: /etc/livekit-egress.yaml
    volumes:
      - ./apps/api/infra/livekit-egress.yaml:/etc/livekit-egress.yaml:ro
    # The realtime translator's PCMPump runs inside the worker container on
    # :9600; track egress dials it to stream raw PCM for translation. DNS for
    # `worker` resolves via livekit's compose network (shared netns).
    depends_on:
      - livekit
      - redis
      - floci
      - worker

  # S3-compatible storage for uploads and processed audio (browser-reachable).
  # NOTE: floci's distroless image has no shell/wget, so no container
  # healthcheck — api/worker readiness covers it functionally.
  floci:
    image: floci/floci:latest
    ports:
      - "${S3_HOST_PORT:-4567}:4566"

  api:
    build:
      context: .
      dockerfile: Go.Dockerfile
    command: ["api"]
    environment:
      GOONJ_ENV: ${GOONJ_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-goonj}:${POSTGRES_PASSWORD:-goonj}@postgres:5432/${POSTGRES_DB:-goonj}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://livekit:7880}
      # Browser-facing media endpoint for join tokens (defaults to LIVEKIT_URL
      # when empty — browser and server must resolve LiveKit the same way).
      LIVEKIT_CLIENT_URL: ${LIVEKIT_CLIENT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecret}
      S3_ENDPOINT: http://floci:4566
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:4567}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-goonj-audio-dev}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-test}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-test}
      S3_USE_PATH_STYLE: "true"
      S3_CDN_BASE_URL: ${S3_CDN_BASE_URL:-}
      JWT_SECRETS_PREVIOUS: ${JWT_SECRETS_PREVIOUS:-}
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6

  worker:
    build:
      context: .
      dockerfile: Go.Dockerfile
    command: ["worker"]
    environment:
      GOONJ_ENV: ${GOONJ_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-goonj}:${POSTGRES_PASSWORD:-goonj}@postgres:5432/${POSTGRES_DB:-goonj}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://livekit:7880}
      # Browser-facing media endpoint for join tokens (defaults to LIVEKIT_URL
      # when empty — browser and server must resolve LiveKit the same way).
      LIVEKIT_CLIENT_URL: ${LIVEKIT_CLIENT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecret}
      S3_ENDPOINT: http://floci:4566
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:4567}
      S3_BUCKET: ${S3_BUCKET:-goonj-audio-dev}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-test}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-test}
      S3_USE_PATH_STYLE: "true"
      S3_CDN_BASE_URL: ${S3_CDN_BASE_URL:-}
      # AI (Phase 5): optional; baselines run when keys are absent.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_STT_MODEL: ${OPENAI_STT_MODEL:-whisper-1}
      OPENAI_EMBED_MODEL: ${OPENAI_EMBED_MODEL:-text-embedding-3-small}
      OPENAI_SUMMARY_MODEL: ${OPENAI_SUMMARY_MODEL:-gpt-4o-mini}
      WHISPER_CPP_BIN: ${WHISPER_CPP_BIN:-}
      WHISPER_CPP_MODEL: ${WHISPER_CPP_MODEL:-}
      # Set to 1 when OPENAI_BASE_URL points at a provider without an
      # /embeddings endpoint (e.g. Groq); hash embedder takes over.
      EMBEDDINGS_DISABLED: ${EMBEDDINGS_DISABLED:-0}
      # Realtime translator (Phase 5.5): the PCMPump listens here and the
      # livekit-egress container must reach it at worker:9600.
      TRANSLATOR_PUMP_ADDR: worker:9600
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  ws-gateway:
    build:
      context: .
      dockerfile: Go.Dockerfile
    command: ["ws-gateway"]
    environment:
      GOONJ_ENV: ${GOONJ_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_PORT: 8081
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      JWT_SECRETS_PREVIOUS: ${JWT_SECRETS_PREVIOUS:-}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${WS_HOST_PORT:-8081}:8081"

  seed:
    build:
      context: .
      dockerfile: Go.Dockerfile
    command: ["seed"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-goonj}:${POSTGRES_PASSWORD:-goonj}@postgres:5432/${POSTGRES_DB:-goonj}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # Build-time inlined into the browser bundle (see Dockerfile.web).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8082}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8082}
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:

openapi: 3.1.0
info:
  title: Goonj API
  version: 0.5.0
  description: >-
    Audio-only platform API (on-demand + live). Phases 0-3 implemented
    (health, auth, upload pipeline, live core, live recordings). Phase 4 adds
    the on-demand & social surface: search, likes, comments, follows,
    playlists, listening history, and the subscriptions feed.
servers:
  - url: /api/v1
    description: Local development
tags:
  - name: system
  - name: auth
  - name: live
  - name: audio
  - name: notifications
  - name: moderation
  - name: discovery
paths:
  /ping:
    get:
      tags: [system]
      summary: Liveness ping
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: goonj-api }
  /health:
    get:
      tags: [system]
      summary: Aggregate health
      responses:
        "200":
          description: Health summary
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: string }
  /health/services:
    get:
      tags: [system]
      summary: Per-dependency health
      responses:
        "200":
          description: Map of dependency name to status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: string }
  /auth/register:
    post:
      tags: [auth]
      summary: Create a listener account (Phase 1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "501":
          description: Not implemented until Phase 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/login:
    post:
      tags: [auth]
      summary: Exchange credentials for tokens (Phase 1)
      responses:
        "501":
          description: Not implemented until Phase 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /live/{id}/recording:
    get:
      tags: [live]
      summary: Recording status for a session (owner only)
      description: >-
        Returns the latest egress recording for the session. After a stream
        ends, the worker converts the recording into a PRIVATE draft episode
        (audio row); its id appears in audio_id once conversion finishes.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Recording status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveRecording"
        "403":
          description: Not the session owner
        "404":
          description: Session or recording not found
  /audio/{id}:
    patch:
      tags: [audio]
      summary: Edit metadata or publish a draft episode (creator only)
      description: >-
        With visibility=public, flips a READY private draft (e.g. a converted
        live recording) into a public episode. Without it, performs a
        metadata-only edit (title/description/category).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchAudioRequest"
      responses:
        "200":
          description: Updated audio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Audio"
        "400":
          description: Invalid state (not READY/private) or invalid title
        "403":
          description: Not the owner
        "404":
          description: Audio not found
  /search:
    get:
      tags: [audio]
      summary: Unified search over audio and creators (Phase 4)
      description: >-
        Full-text (websearch syntax) plus trigram fuzzy matching. Empty q
        returns empty result sets, not the whole catalog.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, maxLength: 200 }
        - name: limit
          in: query
          schema: { type: integer, default: 25, maximum: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Audio and creator hits ranked by relevance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
  /audio/{id}/like:
    get:
      tags: [audio]
      summary: Like state for an episode (count + viewer state)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Like summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeState"
    post:
      tags: [audio]
      summary: Like an episode
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Like summary after the write
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeState"
      security: [{ bearerAuth: [] }]
    delete:
      tags: [audio]
      summary: Remove the viewer's like
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Like summary after the write
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeState"
      security: [{ bearerAuth: [] }]
  /audio/{id}/comments:
    get:
      tags: [audio]
      summary: Comment thread for an episode
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Top-level comments plus one level of replies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentThread"
    post:
      tags: [audio]
      summary: Add a comment or reply
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 1000 }
                parent_id: { type: string, format: uuid }
      responses:
        "201":
          description: Created comment
      security: [{ bearerAuth: [] }]
  /creators/{id}:
    get:
      tags: [audio]
      summary: Public creator page (channel + episodes + viewer follow state)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Channel summary with episodes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorPage"
        "404":
          description: Creator not found
  /creators/{id}/follow:
    post:
      tags: [audio]
      summary: Follow a creator
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Follow state after the write
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowState"
      security: [{ bearerAuth: [] }]
    delete:
      tags: [audio]
      summary: Unfollow a creator
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Follow state after the write
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowState"
      security: [{ bearerAuth: [] }]
  /subscriptions/feed:
    get:
      tags: [audio]
      summary: Newest episodes across followed creators
      responses:
        "200":
          description: Episode list, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/FeedItem"
      security: [{ bearerAuth: [] }]
  /history/{id}/progress:
    post:
      tags: [audio]
      summary: Record listening progress (upsert, one row per user+audio)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                position_ms: { type: integer }
                duration_ms: { type: integer }
      responses:
        "200":
          description: Progress recorded
      security: [{ bearerAuth: [] }]
  /history/{id}/resume:
    get:
      tags: [audio]
      summary: Saved position for an episode (continue-listening)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Saved position
          content:
            application/json:
              schema:
                type: object
                properties:
                  position_ms: { type: integer }
                  completed: { type: boolean }
      security: [{ bearerAuth: [] }]
  /playlists:
    get:
      tags: [audio]
      summary: List the caller's playlists
      responses:
        "200":
          description: Playlist metadata list
      security: [{ bearerAuth: [] }]
    post:
      tags: [audio]
      summary: Create a playlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 120 }
                description: { type: string }
                visibility: { type: string, enum: [public, private] }
      responses:
        "201":
          description: Created playlist
      security: [{ bearerAuth: [] }]
  /playlists/{id}:
    get:
      tags: [audio]
      summary: Playlist detail with ordered items
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Playlist with items
        "404":
          description: Playlist not found or private
    patch:
      tags: [audio]
      summary: Update playlist metadata (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Updated playlist
      security: [{ bearerAuth: [] }]
    delete:
      tags: [audio]
      summary: Delete a playlist (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Deleted
      security: [{ bearerAuth: [] }]
  /playlists/{id}/items:
    post:
      tags: [audio]
      summary: Append an episode (body {audio_id}; idempotent)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Added (or already present)
      security: [{ bearerAuth: [] }]
  /audio/studio/stats:
    get:
      tags: [audio]
      summary: Creator studio dashboard stats
      responses:
        "200":
          description: Episode/like/live aggregates for the signed-in creator
      security: [{ bearerAuth: [] }]
  /notifications:
    get:
      tags: [notifications]
      summary: List the caller's notifications (Phase 5)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 100 }
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Notification"
  /notifications/unread-count:
    get:
      tags: [notifications]
      summary: Unread badge count
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Count of unread notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  unread: { type: integer }
  /notifications/read-all:
    post:
      tags: [notifications]
      summary: Mark every notification read
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: ok
  /notifications/{id}/read:
    post:
      tags: [notifications]
      summary: Mark one notification read (owner-checked)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: ok
  /reports:
    post:
      tags: [moderation]
      summary: File a report against an episode or live session (Phase 5)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileReportRequest"
      responses:
        "201":
          description: Report filed (duplicate pending reports collapse)
        "400":
          description: Missing target or invalid reason
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [moderation]
      summary: Moderation queue (MODERATOR/ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, RESOLVED, DISMISSED]
            default: PENDING
      responses:
        "200":
          description: Reports newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Report"
        "403":
          description: Not a moderator
  /reports/{id}/resolve:
    post:
      tags: [moderation]
      summary: Resolve a report (MODERATOR/ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: ok
        "404":
          description: Not pending or not found
  /reports/{id}/dismiss:
    post:
      tags: [moderation]
      summary: Dismiss a report (MODERATOR/ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: ok
        "404":
          description: Not pending or not found
  /trending:
    get:
      tags: [discovery]
      summary: Trending episodes (public, time-decayed ZSET)
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 50 }
      responses:
        "200":
          description: Top episodes by weighted recent engagement
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AudioHit"
  /recommendations:
    get:
      tags: [discovery]
      summary: Personalized feed seeded from the last listened episode (Phase 5)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 12, maximum: 50 }
      responses:
        "200":
          description: Similar episodes; falls back to trending when no history
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AudioHit"
                  seed:
                    type: string
                    format: uuid
                    nullable: true
                    description: Episode the recommendations were seeded from
  /recommendations/audio/{id}:
    get:
      tags: [discovery]
      summary: More like this episode (pgvector similarity)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, default: 10, maximum: 50 }
      responses:
        "200":
          description: Nearest READY public episodes by transcript embedding
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AudioHit"
  /live/upcoming:
    get:
      tags: [live]
      summary: Public scheduled sessions with a future start (Phase 5)
      responses:
        "200":
          description: Ordered by scheduled_at ascending
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/LiveSession"
  /live/{id}/schedule:
    post:
      tags: [live]
      summary: Set or clear a session's planned start (creator only, Phase 5)
      description: >-
        Pass a future RFC3339 time to schedule (within 30 days) or a zero
        value to clear. Followers are reminded ~10 minutes before the start.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scheduled_at:
                  type: string
                  format: date-time
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveSession"
        "400":
          description: Not owner, wrong status, or time out of window
  /audio/{id}/transcript:
    get:
      tags: [audio]
      summary: Transcript chunks and AI summary for an episode (Phase 5)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Timed chunks, oldest first; summary when generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transcript"
        "404":
          description: No transcript produced yet
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LikeState:
      type: object
      properties:
        liked: { type: boolean }
        likes: { type: integer, format: int64 }
    CommentThread:
      type: object
      properties:
        data:
          type: object
          properties:
            comments:
              type: array
              items:
                $ref: "#/components/schemas/Comment"
            replies:
              type: array
              items:
                $ref: "#/components/schemas/Comment"
    Comment:
      type: object
      properties:
        id: { type: string, format: uuid }
        audio_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        username: { type: string }
        parent_id:
          type: string
          format: uuid
          nullable: true
        body: { type: string }
        is_pinned: { type: boolean }
        like_count: { type: integer }
        mine: { type: boolean }
        created_at: { type: string, format: date-time }
    SearchResults:
      type: object
      properties:
        query: { type: string }
        audio:
          type: array
          items:
            $ref: "#/components/schemas/HitAudio"
        creators:
          type: array
          items:
            $ref: "#/components/schemas/HitCreator"
    HitAudio:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        category: { type: string }
        creator_id: { type: string, format: uuid }
        creator_name: { type: string }
        handle: { type: string }
        duration_ms: { type: integer }
        published_at:
          type: string
          format: date-time
          nullable: true
        rank: { type: number }
    HitCreator:
      type: object
      properties:
        id: { type: string, format: uuid }
        handle: { type: string }
        channel_name: { type: string }
        tagline: { type: string }
        is_live: { type: boolean }
        subscriber_count: { type: integer, format: int64 }
        rank: { type: number }
    CreatorPage:
      type: object
      properties:
        creator:
          type: object
          properties:
            id: { type: string, format: uuid }
            handle: { type: string }
            channel_name: { type: string }
            tagline: { type: string }
            is_live: { type: boolean }
            subscriber_count: { type: integer, format: int64 }
        episodes:
          type: array
          items:
            $ref: "#/components/schemas/FeedItem"
        following: { type: boolean }
    FollowState:
      type: object
      properties:
        following: { type: boolean }
        subscribers: { type: integer, format: int64 }
    FeedItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        category: { type: string }
        creator_id: { type: string, format: uuid }
        creator_name: { type: string }
        handle: { type: string }
        duration_ms: { type: integer }
        published_at:
          type: string
          format: date-time
          nullable: true
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [live_started, recording_ready, new_follower, session_reminder]
        title: { type: string }
        body: { type: string }
        session_id:
          type: string
          format: uuid
          nullable: true
        audio_id:
          type: string
          format: uuid
          nullable: true
        actor_id:
          type: string
          format: uuid
          nullable: true
        read: { type: boolean }
        created_at: { type: string, format: date-time }
    FileReportRequest:
      type: object
      required: [reason]
      properties:
        audio_id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        reason:
          type: string
          enum: [spam, harassment, copyright, explicit, misinformation, other]
        details:
          type: string
          maxLength: 1000
    Report:
      type: object
      properties:
        id: { type: string, format: uuid }
        reporter_id: { type: string, format: uuid }
        audio_id:
          type: string
          format: uuid
          nullable: true
        session_id:
          type: string
          format: uuid
          nullable: true
        reason: { type: string }
        details: { type: string }
        status:
          type: string
          enum: [PENDING, RESOLVED, DISMISSED]
        resolved_by:
          type: string
          format: uuid
          nullable: true
        resolved_at:
          type: string
          format: date-time
          nullable: true
        created_at: { type: string, format: date-time }
    AudioHit:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        category: { type: string }
        creator_id: { type: string, format: uuid }
        creator_name: { type: string }
        handle: { type: string }
        duration_ms: { type: integer }
        published_at:
          type: string
          format: date-time
          nullable: true
    LiveSession:
      type: object
      properties:
        id: { type: string, format: uuid }
        creator_id: { type: string, format: uuid }
        creator_name: { type: string }
        handle: { type: string }
        title: { type: string }
        description: { type: string }
        category: { type: string }
        status:
          type: string
          enum: [SCHEDULED, LIVE, ENDED, CANCELLED]
        visibility:
          type: string
          enum: [public, private]
        scheduled_at:
          type: string
          format: date-time
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        ended_at:
          type: string
          format: date-time
          nullable: true
        peak_listeners: { type: integer }
        total_listeners: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
    Transcript:
      type: object
      required: [audio_id, chunks]
      properties:
        audio_id: { type: string, format: uuid }
        chunks:
          type: array
          items:
            type: object
            properties:
              idx: { type: integer }
              start_ms: { type: integer }
              end_ms: { type: integer }
              speaker:
                type: string
                nullable: true
              text: { type: string }
        summary:
          type: object
          nullable: true
          properties:
            summary: { type: string }
            model: { type: string }
            updated_at: { type: string, format: date-time }
    LiveRecording:
      type: object
      properties:
